older:
  - title: Resume Auto-Fill Chrome Extension
    section: earlier
    started_on: "2025-06-23"
    tags: JavaScript, Chrome Extension, Python, Flask, PyPDF2, Tesseract OCR, Ollama
    description: >-
      A Chrome extension that fills in job applications from your resume and LinkedIn profile. I
      built it as a side project during my job hunt, tired of typing the same details into every job
      site. It never went past a working prototype: the reading works, but the form filling needs
      more testing.
    highlights:
      - Built a LinkedIn profile reader that walks experience, education and skills, even several roles at one company. I started from someone else's open-source scraper and built on it.
      - Wrote a Flask server that reads PDF resumes, with OCR for scanned ones.
      - Sent the messy fields (company names, job descriptions, skills) to a local Llama model through Ollama to clean them up.
      - Set it up for 10 job sites, from LinkedIn and Indeed to Wantedly and GaijinPot.

  - title: Portfolio website
    section: earlier
    started_on: "2025-06-17"
    tags: Ruby on Rails, Hotwire, PostgreSQL, Cloudinary, Bootstrap, Heroku
    description: >-
      The site you're on. It was my first project outside Le Wagon, and I still build it: projects,
      photos, a blog, and casual events people can sign up for. It's been my learning ground for
      building a site for everyone, not just one niche.
    highlights:
      - "Layered spam defenses on the contact form: hidden honeypot fields, timing checks, a rate limit and a spam score. Bots get a fake \"thanks\"."
      - An admin area for projects, photos, the blog and events. Photos upload in bulk in the background, and big files shrink automatically.
      - Event sign-ups with capacity limits, where guests can pick what to bring.
      - "Search-engine basics: structured data, a live sitemap, and a visitor counter that ignores bots."
      - Redesigned it with seigaiha waves, device-framed project cards and a film-style photo contact sheet.

  - title: Tokyo Turntable
    section: bootcamp
    started_on: "2025-05-26"
    tags: Ruby on Rails, Selenium, Tesseract OCR, Spotify API, OpenAI, Mapbox, PostgreSQL
    description: >-
      Find live shows around Tokyo by genre and place. It was our Le Wagon final project, built by
      four of us. I built the data side: the scrapers, the flyer OCR and the Spotify matching.
    highlights:
      - Rebuilt the scraper to read each venue's own website instead of one listings site. That took us from 275 gigs to almost 4,000.
      - Made it scrape in parallel, with a polite mode that checks each site's robots.txt and waits between sites.
      - Read gig flyers with OCR, in Japanese and English, from images and PDFs.
      - Matched band names to Spotify artists so gig pages can play a preview, with GPT-4 helping pull the names out of messy listings.
      - Also built the search by place, distance and genre, and the map view.

  - title: レンtool
    section: bootcamp
    started_on: "2025-05-01"
    tags: Ruby on Rails, PostgreSQL, Mapbox, Devise, Flatpickr, Cloudinary
    description: >-
      Airbnb for tools: rent a tool from a neighbour, or rent yours out. It was a Le Wagon team
      project with four of us; I set up the repo and ran the merges.
    highlights:
      - "Built the tool page and date booking: pick your dates, and the price is worked out per day."
      - Added the Mapbox map, with each tool's address geocoded and a search box on the map.
      - Designed the user dashboard, where owners accept or reject rental requests.
      - Put it live on Heroku.

  - title: Rails-watch-list
    section: bootcamp
    started_on: "2025-05-01"
    tags: Ruby on Rails, PostgreSQL, TMDB API, Cloudinary, Bootstrap, Heroku
    description: >-
      My first Rails app at Le Wagon, built solo. Make movie lists, add films from a catalogue of
      top-rated movies, and leave a note on each one.
    highlights:
      - "Filled the catalogue from the TMDB API: top-rated films with posters, overviews and ratings."
      - "Built the data model: lists hold movies through bookmarks, a film can only be in a list once, and every bookmark needs a short comment."
      - Added list cover photos, uploaded to Cloudinary.
      - Put it live on Heroku.
