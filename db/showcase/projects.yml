# The project cards, read by `bin/rails showcase:load` (app/services/showcase_loader.rb).
# Featured ones show on the home page in this order; images live next to this file. started_on
# is when Julian began each one; it sorts the Projects page but isn't shown (work may be ongoing).
# tags are the stack, 5–7, headline first: the small cards show only the first three. highlights are the
# project page's "What I built" bullets. All checked against each repo's code and history,
# 2026-09-26.
featured:
  - title: Menyu
    started_on: "2026-06-15"
    frame: phone
    image: menyu-1.jpg
    icon: menyu-icon.png
    screenshots: [menyu-2.jpg, menyu-3.jpg]
    live_url: https://apps.apple.com/us/app/mymenyu/id6781243160
    tags: Flutter, FastAPI, Qwen vision, Apple Vision OCR, Google Cloud Run, Supabase, ML Kit
    description: >-
      Snap any menu and read it in your language, instantly. Tap to order, share with your table,
      or flip back to show your waiter exactly what you want. Live on the App Store. I lead its
      development: the AI that reads menus, the allergen warnings, and a nightly checker that tests
      real scans.
    highlights:
      - Designed the menu-reading pipeline. Each page of a menu is read in parallel, and dishes stream in as they're ready.
      - Built a coverage check that spots parts of a menu the scan missed and re-reads them automatically.
      - Built allergen warnings with several layers of safety, and closed a gap in the tests that would have let the most serious allergy rules be deleted unnoticed.
      - Run it end to end, from the Flutter app to the FastAPI server on Google Cloud Run, with more than 9,000 automated tests.
      - Built a nightly checker that re-scans real menus and flags the ones that need a human look.
      - "Added table ordering: friends join with a short code and order together."

  - title: Sollo
    started_on: "2026-06-02"
    frame: phone
    image: sollo-1.jpg
    icon: sollo-icon.png
    screenshots: [sollo-2.jpg, sollo-3.jpg]
    live_url: https://apps.apple.com/us/app/sollo-life-nav/id6781235016
    tags: Python, Flutter, RAG, pgvector, PostgreSQL, Tesseract OCR, Qwen
    description: >-
      Life in Japan, explained, from official government sources. I built the scrapers and search
      pipeline behind it on my own, wrote its first AI server, and led the Flutter app with a small
      team.
    highlights:
      - Built the whole data pipeline on my own. It scrapes about 48 official sources, reads scanned PDFs with OCR, and has nearly 2,900 tests.
      - "Made search hybrid: Japanese full-text search plus vector search, both in Postgres."
      - Wrote the original AI server that answers from those sources (retrieval-augmented generation, or RAG). It first ran a self-hosted Gemma model on a GPU; I moved it to a hosted Qwen model.
      - Tracked down two production outages caused by the pipeline's own database load, and fixed them by pacing its jobs.

  - title: MyTap
    started_on: "2026-09-14"
    frame: phone
    image: mytap-1.jpg
    icon: mytap-icon.png
    live_url: https://sollo.my/tap
    tags: Next.js, Supabase, Stripe, TypeScript, PostgreSQL, Vercel
    description: >-
      Check in and out of a coworking space with one tap, by NFC sticker or QR code. I built it
      solo: sign-up, time-based pricing, Stripe checkout and a staff dashboard, in English and
      Japanese.
    highlights:
      - Built the first working version solo in a single day, then refined it on and off over two weeks.
      - Wrote the pricing inside the database, as Postgres functions, with SQL tests for refunds and re-entry.
      - Integrated Stripe Checkout with signed webhooks, tagged so one Stripe account can safely serve two deployments.
      - Added a monthly free-visit limit and prepaid day passes.
      - Moved it from its own deployment into a shared codebase without breaking it. It launches at its first coworking space, in Shibuya.

  - title: AlturaFlow
    started_on: "2025-06-01"
    frame: browser
    image: alturaflow.jpg
    live_url: https://alturaflow.com
    tags: Next.js, TypeScript, Lightweight Charts, Stripe, Crystallize CMS, Python, next-intl
    description: >-
      I built its own charting engine, ported our own indicator from Pine Script to
      TypeScript, built out many of its pages in nine languages, and added trial billing and
      onboarding. I joined as a UI/UX design intern and grew into the back end.
    highlights:
      - Started as a UI/UX design intern. Within a few months I moved from landing pages and account screens into the back end, from sign-in rules to the onboarding emails.
      - Replaced an embedded TradingView chart with our own charting engine, built on Lightweight Charts, with about 18 indicators. I'm its main author.
      - Ported our own price-action indicator from Pine Script to TypeScript, and kept the port in step as the original was tuned.
      - Designed and built pages across the site, including much of the homepage, the products and pricing pages, insights and the dashboard, and translated them into all nine of its languages.
      - Connected the Insights blog to Crystallize, a headless CMS, then built a Python content pipeline that picks market news with Claude and publishes it there, with its own database models and migrations.
      - Added the free trial on top of our Stripe setup. I also co-built the system that grants and revokes TradingView indicator access for paying members, kept in sync by a scheduled job.
      - Did the rename from Trendrider to AlturaFlow across the site.

  - title: imagebank-reader
    started_on: "2026-09-13"
    frame: terminal
    tags: Python, C, Reverse engineering, Ghidra, DNG, FireWire
    description: >-
      Rescuing photos from an old camera storage box that no modern Mac can read. I
      reverse-engineered its disk format and pulled real photos back off it.
    highlights:
      - Imaged the box's disk and decoded its raw layout in Python, recovering 91 photos.
      - Turned them into 16-bit DNG raw files that open in Photos, Preview and Lightroom. The pixels are untouched, except two dead sensor columns I mapped and filled in from their neighbours.
      - "Reverse-engineered the box's protocol from its old desktop software with Ghidra. Then I wrote a C tool that is read-only by design: it can't delete, format or touch firmware. It hasn't managed to talk to the real hardware yet."

  - title: CS12 Skincare
    started_on: "2026-07-21"
    frame: browser
    image: cs12.jpg
    live_url: https://cs12skincare.com.hk
    tags: WordPress, WooCommerce, PHP, WPLoyalty, TranslatePress, Next.js
    description: >-
      I look after a Hong Kong skincare brand's live WooCommerce store on my own: fixes, campaigns,
      the loyalty program. I pitched for it with a Next.js mockup.
    highlights:
      - Pitched for the work with a bilingual Next.js redesign mockup, built in about three days.
      - "Built the English version of the store: all 47 pages and 60 products."
      - Set up email authentication (SPF, DKIM and DMARC) to stop the brand's marketing email landing in spam.
      - Compared moving hosts with rebuilding, and showed the loyalty points live in custom database tables. That made the case for staying on WooCommerce.
      - Fixed a broken button that appeared across the site, found about 29 GB of old backups bloating the server, caught a loyalty-points setting that was giving away too much, and closed voucher products anyone could get with a direct link.

  - title: YS Club
    started_on: "2026-09-17"
    frame: browser
    image: ysclub.jpg
    tags: Next.js, Tailwind CSS, i18n, TypeScript, Vercel
    description: >-
      A site redesign for a ski school in Yamagata. I designed and built every page as a working
      demo, in three languages, before the real build starts.
    highlights:
      - Designed and built the whole redesign as a working demo, 15 pages in Traditional Chinese, English and Japanese.
      - Built it on my own in Next.js and Tailwind in under a week.
      - The site picks the visitor's language from their browser, with a switcher that remembers their choice.
      - Shared as a private preview for the school; the real build comes next.

# Everything else stays on the Projects page, grouped by era, but off the home page. Matched by
